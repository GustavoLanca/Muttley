<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muttley - Minhas Participações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/user/evento}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/user/evento}">Eventos Disponíveis</a>
      <a th:href="@{/user/evento/participacoes}" class="active">Minhas Participações</a>
      <a th:href="@{/user/evento/medalhas}">Medalhas e Certificados</a>
      <a th:href="@{/user/evento/cadastro}">Cadastro</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Consultar Minhas Participações</h1>
    </div>

    <div class="card-custom" style="margin-bottom: 24px;">
      <div class="card-custom-body">
        <form th:action="@{/user/evento/participacoes}" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="cpf" style="font-weight: 600; color: var(--gray-700);">Digite seu CPF para buscar seu histórico:</label>
            <input type="text" id="cpf" name="cpf" th:value="${cpf}" placeholder="000.000.000-00" required 
                   style="width: 100%; max-width: 400px; padding: 10px 14px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px;">
          </div>
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <button type="submit" class="btn-custom btn-custom-primary">Buscar Participações</button>
            <span style="color: var(--gray-400); font-size: 0.875rem;">ou</span>
            <a th:href="@{/user/evento/cadastro}" class="btn-custom btn-custom-outline btn-custom-sm">Cadastre-se</a>
          </div>
        </form>
      </div>
    </div>

    <div th:if="${erro}" class="badge-custom" style="background: #fee2e2; color: #ef4444; padding: 12px; border-radius: 6px; margin-bottom: 16px; display: block; text-align: center; font-weight: 500;">
      <span th:text="${erro}"></span>
    </div>

    <th:block th:if="${participacoes != null}">
      <th:block th:if="${#lists.isEmpty(participacoes)}">
        <div class="card-custom">
          <div class="card-custom-body">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              <p>Nenhuma inscrição ou participação encontrada para o CPF informado.</p>
            </div>
          </div>
        </div>
      </th:block>

      <th:block th:unless="${#lists.isEmpty(participacoes)}">
        <div class="card-custom">
          <div class="card-custom-body" style="padding:0;">
            <table class="table-custom">
              <thead>
                <tr>
                  <th>Evento</th>
                  <th>Data</th>
                  <th>Inscrição</th>
                  <th>Presença</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${participacoes}">
                  <td data-label="Evento" th:text="${p.evento.titulo}"></td>
                  <td data-label="Data" th:text="${#temporals.format(p.evento.data, 'dd/MM/yyyy')}"></td>
                  <td data-label="Inscrição">
                    <span class="badge-custom" style="background: var(--success-light); color: var(--success);">Inscrito</span>
                  </td>
                  <td data-label="Presença">
                    <span th:if="${p.confirmado}" class="badge-custom" style="background: var(--info-light); color: var(--info);">Confirmada</span>
                    <span th:unless="${p.confirmado}" class="badge-custom" style="background: var(--gray-100); color: var(--gray-400);">Pendente</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </th:block>
    </th:block>

    <div style="margin-top:16px;">
      <a th:href="@{/user/evento}" class="btn-custom btn-custom-outline">Voltar para Eventos</a>
    </div>
  </div>
</main>

</body>
</html>
