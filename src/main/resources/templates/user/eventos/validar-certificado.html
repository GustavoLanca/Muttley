<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muttley - Validar Certificado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/user/evento}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley 
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/user/evento}">Eventos Disponíveis</a>
      <a th:href="@{/user/evento/participacoes}">Minhas Participações</a>
      <a th:href="@{/user/evento/certificado}">Certificados</a>
      <a th:href="@{/user/evento/cadastro}">Cadastro</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Validar Certificado</h1>
    </div>

    <div th:if="${erro}" class="alert-custom alert-custom-danger" style="text-align:center;">
      <div th:text="${erro}"></div>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <div class="empty-state" style="padding-bottom: 16px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #eab308; width: 48px; height: 48px;">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <p style="max-width: 500px; margin: 0 auto 16px auto;">Insira o hash do certificado para fazer o download.</p>
        </div>

        <form th:action="@{/user/evento/certificado/validar}" method="POST" style="display: flex; flex-direction: column; gap: 16px; align-items: center;">
          <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 500px; text-align: left;">
            <label for="hash" style="font-weight: 600; color: var(--gray-700);">Hash do Certificado:</label>
            <input type="text" id="hash" name="hash" placeholder="Cole o hash do certificado" required
                   style="width: 100%; padding: 10px 14px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px; font-family: monospace;">
          </div>
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;">
            <button type="submit" class="btn-custom btn-custom-primary">Baixar Certificado</button>
          </div>
        </form>
      </div>
    </div>

    <div style="margin-top:16px;text-align:center;">
      <a th:href="@{/user/evento}" class="btn-custom btn-custom-outline">Voltar para Eventos</a>
    </div>
  </div>
</main>

</body>
</html>
