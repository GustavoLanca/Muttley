<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muttley - Certificados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/user/evento}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley 
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
		<div class="navbar-links">
		  <a th:href="@{/user/evento}">Eventos Disponíveis</a>
		  <a th:href="@{/user/evento/participacoes}">Minhas Participações</a>
      <a th:href="@{/user/evento/certificado}">Certificados</a>
      <a th:href="@{/user/evento/cadastro}">Cadastro</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Solicitar Certificados</h1>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <div class="empty-state" style="padding-bottom: 16px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #eab308;">
            <circle cx="12" cy="8" r="7"></circle>
            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
          </svg>
          <p style="max-width: 500px; margin: 0 auto 16px auto;">Insira o seu CPF cadastrado para enviarmos por email os seus certificados.</p>
        </div>

        <form th:action="@{/user/evento/certificado}" method="POST" style="display: flex; flex-direction: column; gap: 16px; align-items: center;">
          <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; text-align: left;">
            <label for="cpf" style="font-weight: 600; color: var(--gray-700);">CPF cadastrado:</label>
            <input type="text" id="cpf" name="cpf" placeholder="Apenas números" required maxlength="11"
                   style="width: 100%; padding: 10px 14px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px;">
          </div>
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;">
            <button type="submit" class="btn-custom btn-custom-primary">Enviar Certificados</button>
            <span style="color: var(--gray-400); font-size: 0.875rem;">ou</span>
            <a th:href="@{/user/evento/cadastro}" class="btn-custom btn-custom-outline btn-custom-sm">Cadastre-se</a>
          </div>
        </form>
      </div>
    </div>

    <div th:if="${sucesso}" class="badge-custom" style="background: #dcfce7; color: #16a34a; padding: 16px; border-radius: 6px; margin-top: 20px; display: block; text-align: center; font-weight: 500;">
      <span th:text="${sucesso}"></span>
    </div>

    <th:block th:if="${erro}">
      <div class="badge-custom" style="background: #fee2e2; color: #ef4444; padding: 16px; border-radius: 6px; margin-top: 20px; display: block; text-align: center; font-weight: 500;">
        <span th:text="${erro}"></span>
      </div>
    </th:block>

  </div>
</main>

</body>
</html>
