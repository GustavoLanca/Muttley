<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muttley - Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/user/evento}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/user/evento}">Eventos Disponíveis</a>
      <a th:href="@{/user/evento/participacoes}">Minhas Participações</a>
      <a th:href="@{/user/evento/medalhas}">Medalhas e Certificados</a>
      <a th:href="@{/user/evento/cadastro}">Cadastro</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:560px;">
    <div class="page-header">
      <h1 class="page-title">Criar Conta</h1>
    </div>

    <div th:if="${erro}" class="badge-custom" style="background: #fee2e2; color: #ef4444; padding: 12px; border-radius: 6px; margin-bottom: 16px; display: block; text-align: center; font-weight: 500;">
      <span th:text="${erro}"></span>
    </div>

    <div th:if="${sucesso}" class="badge-custom" style="background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 6px; margin-bottom: 16px; display: block; text-align: center; font-weight: 500;">
      <span th:text="${sucesso}"></span>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <form th:action="@{/user/evento/cadastro}" th:object="${usuario}" method="post"
              novalidate onsubmit="return validarFormUsuario(this)">

          <input type="hidden" th:field="*{id}"/>

          <div class="form-custom">
            <div class="form-group">
              <label for="nomeUsuario">Nome Completo</label>
              <input type="text" class="form-control-custom" th:field="*{nome}"
                     id="nomeUsuario" placeholder="Digite o nome completo"
                     maxlength="100" required>
              <div class="invalid-feedback">Informe nome e sobrenome, somente letras (mín. 5 caracteres).</div>
            </div>

            <div class="form-group">
              <label for="emailUsuario">E-mail</label>
              <input type="email" class="form-control-custom" th:field="*{email}"
                     id="emailUsuario" placeholder="exemplo@email.com" maxlength="150" required>
              <div class="invalid-feedback">E-mail inválido. Informe um e-mail válido.</div>
            </div>

            <div class="form-group">
              <label for="cpfUsuario">CPF</label>
              <input type="text" class="form-control-custom" th:field="*{cpf}"
                     id="cpfUsuario" placeholder="Apenas números" maxlength="11" required>
              <div class="invalid-feedback">Digite um CPF válido.</div>
            </div>

            <div class="form-group">
              <label for="linkedinUsuario">LinkedIn</label>
              <input type="text" class="form-control-custom" th:field="*{linkedin}"
                     id="linkedinUsuario" placeholder="seu-usuario (sem URL)" maxlength="100">
              <div class="invalid-feedback">Informe o nome de usuário.</div>
            </div>

            <div class="form-group">
              <label for="tipoUsuario">Tipo de Usuário</label>
              <select class="form-control-custom" th:field="*{tipo}" id="tipoUsuario" required>
                <option value="">Selecione...</option>
                <option value="ALUNO">Aluno</option>
                <option value="PROFESSOR">Professor</option>
                <option value="ORGANIZADOR">Organizador</option>
                <option value="PALESTRANTE">Palestrante</option>
                <option value="EXTERNO">Externo</option>
              </select>
              <div class="invalid-feedback">Selecione um tipo de usuário.</div>
            </div>
          </div>

          <div class="card-custom-footer" style="margin-top:20px;padding:16px 0 0;border-top:1px solid var(--gray-100);background:transparent;">
            <a th:href="@{/user/evento}" class="btn-custom btn-custom-outline">Voltar</a>
            <button type="submit" class="btn-custom btn-custom-primary">Cadastrar</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>

<script>
function validarFormUsuario(form) {
  var valido = true;
  form.querySelectorAll('.form-control-custom').forEach(function(input) {
    input.classList.remove('is-invalid');
    if (input.hasAttribute('required') && !input.value.trim()) {
      input.classList.add('is-invalid');
      valido = false;
    }
    if (input.type === 'email' && input.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) {
      input.classList.add('is-invalid');
      valido = false;
    }
    if (input.id === 'nomeUsuario' && input.value.trim().length < 5) {
      input.classList.add('is-invalid');
      valido = false;
    }
    if (input.id === 'cpfUsuario' && input.value.trim()) {
      var digits = input.value.replace(/\D/g, '');
      if (digits.length !== 11 || !validarCpf(digits)) {
        input.classList.add('is-invalid');
        valido = false;
      }
    }
  });
  return valido;
}

function validarCpf(cpf) {
  if (cpf.length !== 11) return false;
  if (/^(\d)\1{10}$/.test(cpf)) return false;

  var sum = 0;
  for (var i = 0; i < 9; i++) sum += parseInt(cpf.charAt(i)) * (10 - i);
  var first = 11 - (sum % 11);
  if (first >= 10) first = 0;
  if (first !== parseInt(cpf.charAt(9))) return false;

  sum = 0;
  for (var i = 0; i < 10; i++) sum += parseInt(cpf.charAt(i)) * (11 - i);
  var second = 11 - (sum % 11);
  if (second >= 10) second = 0;
  return second === parseInt(cpf.charAt(10));
}
</script>
</body>
</html>
