	<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Disciplina</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5" style="max-width: 500px;">
		<div class="card shadow-sm">
			<div class="card-header bg-primary text-white">
				<h4 class="mb-0"
					th:text="${disciplina.id != null} ? 'Editar Disciplina' : 'Nova Disciplina'"></h4>
			</div>
			<div class="card-body">

				<form th:action="@{/disciplina/salvar}" th:object="${disciplina}"
					method="post" novalidate
					onsubmit="return validarFormDisciplina(this)">

					<input type="hidden" th:field="*{id}" />

					<div class="mb-3">
						<label class="form-label fw-semibold">Nome da Disciplina</label> <input
							type="text" class="form-control" th:field="*{nome}"
							id="nomeDisciplina"
							placeholder="Ex: Engenharia de Software, Redes de Computadores"
							maxlength="100" required>
						<div class="invalid-feedback">Nome inválido. Use letras,
							espaços, hífens e números romanos (mín. 3 caracteres).</div>
					<div class="d-flex justify-content-between">
						<a th:href="@{/disciplina}" class="btn btn-secondary">Voltar</a>
						<button type="submit" class="btn btn-primary">Salvar</button>
					</div>

				</form>
			</div>
		</div>
	</div>
</body>
</html>
