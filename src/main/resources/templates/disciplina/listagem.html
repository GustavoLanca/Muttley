<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Disciplinas</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="mb-0">Lista de Disciplinas</h2>
			<a th:href="@{/disciplina/formulario}" class="btn btn-primary">+
				Nova Disciplina</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body p-0">
				<table class="table table-striped table-hover mb-0">
					<thead class="table-primary">
						<tr>
							<th>ID</th>
							<th>Nome</th>
							<th>Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="d : ${lista}">
							<td th:text="${d.id}"></td>
							<td th:text="${d.nome}"></td>
							<td><a th:href="@{'/disciplina/formulario/' + ${d.id}}"
								class="btn btn-sm btn-outline-primary">Editar</a> <a
								th:href="@{'/disciplina/delete/' + ${d.id}}"
								class="btn btn-sm btn-outline-danger"
								onclick="return confirm('Excluir esta disciplina?')">Excluir</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-3">
			<a th:href="@{/}" class="btn btn-secondary">Voltar ao início</a>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
