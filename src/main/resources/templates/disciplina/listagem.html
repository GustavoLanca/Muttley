<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disciplinas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 2L2 12v8l14 10 14-10v-8L16 2z"/>
        <path d="M8 16l4 4 8-8"/>
      </svg>
      Muttley
    </a>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/disciplina}" class="active">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Lista de Disciplinas</h1>
      <a th:href="@{/disciplina/formulario}" class="btn-custom btn-custom-primary">+ Nova Disciplina</a>
    </div>

    <th:block th:if="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <p>Nenhuma disciplina cadastrada.</p>
          </div>
        </div>
      </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body" style="padding:0;">
          <table class="table-custom">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Professor</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="d : ${lista}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.nome}"></td>
                <td th:text="${d.professor != null ? d.professor.nome : '—'}"></td>
                <td>
                  <div class="actions-cell">
                    <a th:href="@{'/disciplina/formulario/' + ${d.id}}"
                       class="btn-custom btn-custom-outline btn-custom-sm">Editar</a>
                    <a th:href="@{'/disciplina/delete/' + ${d.id}}"
                       class="btn-custom btn-custom-danger btn-custom-sm"
                       onclick="return confirm('Excluir esta disciplina?')">Excluir</a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </th:block>

    <div style="margin-top:16px;">
      <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>
    </div>
  </div>
</main>

</body>
</html>
