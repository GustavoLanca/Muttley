<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tag</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
 
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${tag.id != null} ? 'Editar Tag' : 'Nova Tag'"></h4>
        </div>
            <form th:action="@{/tag/salvar}" th:object="${tag}" method="post" novalidate
                  onsubmit="return validarFormTag(this)">
 
                <input type="hidden" th:field="*{id}"/>
 
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome da Tag</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nome}"
                           id="nomeTag"
                           placeholder="Ex: Soft Skills, Redes, Programação"
                           maxlength="50"
                           required>
                </div>
 
                <div class="d-flex justify-content-between">
                    <a th:href="@{/tag}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
 
            </form>
        </div>
    </div>
</div>
</body>
</html>
