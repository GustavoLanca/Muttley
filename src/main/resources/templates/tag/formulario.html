<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 2L2 12v8l14 10 14-10v-8L16 2z"/>
        <path d="M8 16l4 4 8-8"/>
      </svg>
      Muttley
    </a>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}" class="active">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:560px;">
    <div class="page-header">
      <h1 class="page-title" th:text="${tag.id != null} ? 'Editar Tag' : 'Nova Tag'"></h1>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <form th:action="@{/tag/salvar}" th:object="${tag}" method="post" novalidate
              onsubmit="return validarFormTag(this)">

          <input type="hidden" th:field="*{id}"/>

          <div class="form-custom">
            <div class="form-group">
              <label for="nomeTag">Nome da Tag</label>
              <input type="text" class="form-control-custom" th:field="*{nome}"
                     id="nomeTag" placeholder="Ex: Soft Skills, Redes, Programação"
                     maxlength="50" required>
            </div>
          </div>

          <div class="card-custom-footer" style="margin-top:20px;padding:16px 0 0;border-top:1px solid var(--gray-100);background:transparent;">
            <a th:href="@{/tag}" class="btn-custom btn-custom-outline">Voltar</a>
            <button type="submit" class="btn-custom btn-custom-primary">Salvar</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>

</body>
</html>
