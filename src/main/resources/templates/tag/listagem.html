<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tags</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Lista de Tags</h2>
        <a th:href="@{/tag/formulario}" class="btn btn-primary">+ Nova Tag</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${lista}">
                        <td th:text="${t.id}"></td>
                        <td>
                            <span class="badge bg-primary fs-6" th:text="${t.nome}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/tag/formulario/' + ${t.id}}"
                               class="btn btn-sm btn-outline-primary">Editar</a>
                            <a th:href="@{'/tag/delete/' + ${t.id}}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Excluir esta tag?')">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Voltar ao início</a>
    </div>
</div>
</body>
</html>
