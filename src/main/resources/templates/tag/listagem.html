<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tags</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/curso}">Cursos</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}" class="active">Tags</a>
      <a th:href="@{/medalha/ranking}">Medalhas</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Lista de Tags</h1>
      <a th:href="@{/tag/formulario}" class="btn-custom btn-custom-primary">+ Nova Tag</a>
    </div>

    <th:block th:if="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
            <p>Nenhuma tag cadastrada.</p>
          </div>
        </div>
      </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body" style="padding:0;">
          <table class="table-custom">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="t : ${lista}">
                <td data-label="ID" th:text="${t.id}"></td>
                <td data-label="Nome"><span class="badge-custom" th:text="${t.nome}"></span></td>
                <td data-label="Ações">
                  <div class="actions-cell">
                    <a th:href="@{'/tag/formulario/' + ${t.id}}"
                       class="btn-custom btn-custom-outline btn-custom-sm">Editar</a>
                    <a th:href="@{'/tag/delete/' + ${t.id}}"
                       class="btn-custom btn-custom-danger btn-custom-sm"
                       onclick="return confirm('Excluir esta tag?')">Excluir</a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </th:block>

    <div style="margin-top:16px;">
      <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>
    </div>
  </div>
</main>

</body>
</html>
