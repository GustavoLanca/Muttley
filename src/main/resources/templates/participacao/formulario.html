<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Participação</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5" style="max-width: 500px;">
		<div class="card shadow-sm">
			<div class="card-header bg-primary text-white">
				<h4 class="mb-0">Registrar Participação</h4>
			</div>
			<div class="card-body">
				<form th:action="@{/participacao/salvar}" method="post">

					<select class="form-select" name="usuarioId" required>
						<option value="">Selecione um usuário</option>
						<option th:each="u : ${usuarios}" th:value="${u.id}"
							th:text="${u.nome}"></option>
					</select> <select class="form-select" name="eventoId" required>
						<option value="">Selecione um evento</option>
						<option th:each="e : ${eventos}" th:value="${e.id}"
							th:text="${e.titulo}"></option>
					</select>

					<div class="d-flex justify-content-between">
						<a th:href="@{/participacao}" class="btn btn-secondary">Voltar</a>
						<button type="submit" class="btn btn-primary">Registrar</button>
					</div>

				</form>
			</div>
		</div>
	</div>

</body>
</html>
