<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Pontuação</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5">
		<div class="card shadow-sm mb-4">
			<div class="card-header bg-primary text-white">
				<h4 class="mb-0" th:text="'Pontuação de ' + ${usuario.nome}"></h4>
			</div>
			<div class="card-body text-center">
				<h1 class="display-3 fw-bold text-primary" th:text="${totalPontos}"></h1>
				<p class="text-muted">pontos totais</p>
			</div>
		</div>

		<div class="card shadow-sm">
			<div class="card-body p-0">
				<table class="table table-striped table-hover mb-0">
					<thead class="table-primary">
						<tr>
							<th>Evento</th>
							<th>Pontos</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${participacoes}"
							th:if="${p.usuario.id == usuario.id}">
							<td th:text="${p.evento.titulo}"></td>
							<td th:text="${p.pontosGanhos}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="mt-3">
			<a th:href="@{/}" class="btn btn-secondary">Voltar ao início</a>
		</div>
	</div>

</body>
</html>
