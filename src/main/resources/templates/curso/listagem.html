<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/curso}" class="active">Cursos</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
      <a th:href="@{/medalha/ranking}">Medalhas</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Lista de Cursos</h1>
      <a th:href="@{/curso/formulario}" class="btn-custom btn-custom-primary">+ Novo Curso</a>
    </div>

    <th:block th:if="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c0 1.1 2.7 3 6 3s6-1.9 6-3v-5"/>
            </svg>
            <p>Nenhum curso cadastrado.</p>
          </div>
        </div>
      </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body" style="padding:0;">
          <table class="table-custom">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Disciplinas</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${lista}">
                <td data-label="ID" th:text="${c.id}"></td>
                <td data-label="Nome" th:text="${c.nome}"></td>
                <td data-label="Disciplinas" th:text="${#lists.size(c.disciplinas)}"></td>
                <td data-label="Ações">
                  <div class="actions-cell">
                    <a th:href="@{'/curso/formulario/' + ${c.id}}"
                       class="btn-custom btn-custom-outline btn-custom-sm">Editar</a>
                    <a th:href="@{'/curso/delete/' + ${c.id}}"
                       class="btn-custom btn-custom-danger btn-custom-sm"
                       onclick="return confirm('Excluir este curso?')">Excluir</a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </th:block>

    <div style="margin-top:16px;">
      <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>
    </div>
  </div>
</main>

</body>
</html>
