<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/curso}" class="active">Cursos</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
      <a th:href="@{/medalha/ranking}">Medalhas</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:560px;">
    <div class="page-header">
      <h1 class="page-title" th:text="${curso.id != null} ? 'Editar Curso' : 'Novo Curso'"></h1>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <form th:action="@{/curso/salvar}" th:object="${curso}" method="post">

          <input type="hidden" th:field="*{id}"/>

          <div class="form-custom">
            <div class="form-group">
              <label for="nomeCurso">Nome do Curso</label>
              <input type="text" class="form-control-custom" th:field="*{nome}"
                     id="nomeCurso"
                     placeholder="Ex: Ciência da Computação, Engenharia Civil"
                     maxlength="100" required>
            </div>

          </div>

          <div class="card-custom-footer" style="margin-top:20px;padding:16px 0 0;border-top:1px solid var(--gray-100);background:transparent;">
            <a th:href="@{/curso}" class="btn-custom btn-custom-outline">Voltar</a>
            <button type="submit" class="btn-custom btn-custom-primary">Salvar</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>

</body>
</html>
