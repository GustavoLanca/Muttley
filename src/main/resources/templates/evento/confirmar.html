<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar Participação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}" class="active">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/curso}">Cursos</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:520px;">
    <div class="page-header">
      <h1 class="page-title" th:text="${evento.titulo}"></h1>
    </div>

    <div th:if="${message}" class="alert-custom alert-custom-info" th:text="${message}"></div>
    <div th:if="${erro}" class="alert-custom alert-custom-danger" style="text-align:center;">
      <div th:text="${erro}"></div>
      <div th:if="${cpfNaoEncontrado}" style="margin-top: 8px;">
        <a th:href="@{/user/evento/cadastro}" class="btn-custom btn-custom-primary btn-custom-sm">Cadastre-se</a>
      </div>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <form th:if="${sucesso == null}" th:action="@{'/evento/confirmar/' + ${evento.id}}" method="post">
          <div class="form-custom">
            <p style="text-align:center;color:var(--gray-500);font-size:.875rem;margin:0;">
              Confirme sua participação no evento informando seu CPF.
            </p>

            <div class="form-group">
              <label for="cpfInput">CPF</label>
              <input type="text" class="form-control-custom" id="cpfInput" name="cpf"
                     placeholder="Apenas números" maxlength="11" required>
            </div>

            <div style="text-align: center; margin-top: 12px;">
              <span style="color: var(--gray-400); font-size: 0.875rem;">Não possui cadastro?</span>
              <a th:href="@{/user/evento/cadastro}" class="btn-custom btn-custom-outline btn-custom-sm" style="margin-left: 6px;">Cadastre-se</a>
            </div>
          </div>
        </form>

        <div th:if="${sucesso != null}" style="text-align:center;">
          <a th:href="${downloadUrl}" class="btn-custom btn-custom-success">Baixar Certificado</a>
          <a th:href="@{'/evento/confirmar/' + ${evento.id}}" class="btn-custom btn-custom-outline" style="margin-left:8px;">Nova Confirmação</a>
        </div>
      </div>
    </div>

    <div style="margin-top:16px;text-align:center;">
      <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>
    </div>
  </div>
</main>

</body>
</html>
