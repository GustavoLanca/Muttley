<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Confirmar Participação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 500px;">
	<div class="card shadow-sm">
		<div class="card-header bg-primary text-white text-center">
			<h4 class="mb-0" th:text="${evento.titulo}"></h4>
		</div>
		<div class="card-body">

			<div th:if="${sucesso}" class="alert alert-success text-center" th:text="${sucesso}"></div>
			<div th:if="${erro}" class="alert alert-danger text-center" th:text="${erro}"></div>

			<form th:if="${sucesso == null}" th:action="@{'/evento/confirmar/' + ${evento.id}}" method="post">

				<p class="text-muted text-center mb-4">
					Confirme sua participação no evento informando seus dados de acesso.
				</p>

				<div class="mb-3">
					<label class="form-label fw-semibold">E-mail</label>
					<input type="email" class="form-control" name="email"
						placeholder="seu@email.com" required>
				</div>

				<div class="mb-3">
					<label class="form-label fw-semibold">Senha</label>
					<input type="password" class="form-control" name="senha"
						placeholder="Sua senha" required>
				</div>

				<button type="submit" class="btn btn-primary w-100">Confirmar Participação</button>
			</form>

			<div class="text-center mt-3" th:if="${sucesso != null}">
				<a th:href="${downloadUrl}" class="btn btn-success">Baixar Certificado</a>
				<a th:href="@{'/evento/confirmar/' + ${evento.id}}" class="btn btn-outline-primary ms-2">Nova Confirmação</a>
			</div>

		</div>
	</div>
	<div class="text-center mt-3">
		<a th:href="@{/}" class="btn btn-secondary">Voltar ao início</a>
	</div>
</div>

</body>
</html>
