<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">

</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}" class="active">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:800px;">
    <div class="page-header">
      <h1 class="page-title" th:text="${evento.id != null} ? 'Editar Evento' : 'Novo Evento'"></h1>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">

        <form th:action="@{/evento/salvar}" th:object="${evento}" method="post"
              enctype="multipart/form-data" novalidate
              onsubmit="return validarFormEvento(this)">

          <input type="hidden" th:field="*{id}"/>

          <div class="tab-nav">
            <a class="active" href="#" onclick="return mudarTab(this, 'informacoes')">Informações</a>
            <a href="#" onclick="return mudarTab(this, 'publicacao')">Publicação</a>
          </div>

          <div class="tab-content">
          <div class="tab-pane fade show active" id="informacoes">
            <div class="form-custom">

              <div class="form-group">
                <label for="tituloEvento">Título</label>
                <input type="text"
                       class="form-control-custom"
                       th:field="*{titulo}"
                       id="tituloEvento"
                       placeholder="Ex: Workshop de Metodologia Ágil"
                       maxlength="150"
                       required>
              </div>

              <div class="form-group">
                <label for="descricaoEvento">Descrição</label>
                <textarea class="form-control-custom"
                          th:field="*{descricao}"
                          id="descricaoEvento"
                          rows="3"
                          placeholder="Descreva brevemente o evento..."
                          maxlength="500"></textarea>

              </div>

              <div class="form-group">
                <label for="tipoEvento">Tipo</label>
                <select class="form-control-custom" th:field="*{tipo}" id="tipoEvento" required>
                  <option value="">Selecione o tipo...</option>
                  <option value="PALESTRA">Palestra</option>
                  <option value="WORKSHOP">Workshop</option>
                  <option value="AULA_ABERTA">Aula Aberta</option>
                  <option value="SEMINARIO">Seminário</option>
                  <option value="OUTRO">Outro</option>
                </select>
                <div class="invalid-feedback">Selecione o tipo do evento.</div>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
                <div class="form-group">
                  <label for="dataEvento">Data</label>
                  <input type="date"
                         class="form-control-custom"
                         th:field="*{data}"
                         id="dataEvento"
                         required>
                  <div class="invalid-feedback">Informe uma data válida.</div>
                </div>
                <div class="form-group">
                  <label for="horaInicio">Início</label>
                  <input type="time"
                         class="form-control-custom"
                         th:field="*{horaInicio}"
                         id="horaInicio"
                         required>
                  <div class="invalid-feedback">Informe o horário de início.</div>
                </div>
                <div class="form-group">
                  <label for="horaFim">Encerramento</label>
                  <input type="time"
                         class="form-control-custom"
                         th:field="*{horaFim}"
                         id="horaFim"
                         required>
                  <div class="invalid-feedback">Informe o horário de encerramento.</div>
                </div>
              </div>

              <div class="form-group">
                <label>Disciplina Relacionada</label>
                <div style="position:relative;">
                  <input type="text" class="form-control-custom" id="busca-disciplina"
                         placeholder="Buscar disciplina..."
                         autocomplete="off"
                         oninput="buscarDisciplina(this)"
                         onfocus="buscarDisciplina(this)">
                  <div id="resultados-disciplina" class="search-results"></div>
                </div>
                <div id="selecionados-disciplina" class="selected-items"></div>
                <div id="hidden-disciplina"></div>
              </div>

              <div class="form-group">
                <label>Organizadores</label>
                <div style="position:relative;">
                  <input type="text" class="form-control-custom" id="busca-organizadores"
                         placeholder="Buscar organizador..."
                         autocomplete="off"
                         oninput="buscarParticipante(this, 'organizadores')"
                         onfocus="buscarParticipante(this, 'organizadores')">
                  <div id="resultados-organizadores" class="search-results"></div>
                </div>
                <div id="selecionados-organizadores" class="selected-items"></div>
                <div id="hidden-organizadores"></div>
              </div>

              <div class="form-group">
                <label>Palestrantes</label>
                <div style="position:relative;">
                  <input type="text" class="form-control-custom" id="busca-palestrantes"
                         placeholder="Buscar palestrante..."
                         autocomplete="off"
                         oninput="buscarParticipante(this, 'palestrantes')"
                         onfocus="buscarParticipante(this, 'palestrantes')">
                  <div id="resultados-palestrantes" class="search-results"></div>
                </div>
                <div id="selecionados-palestrantes" class="selected-items"></div>
                <div id="hidden-palestrantes"></div>
              </div>

              <div class="form-group">
                <label>Professores</label>
                <div style="position:relative;">
                  <input type="text" class="form-control-custom" id="busca-professores"
                         placeholder="Buscar professor..."
                         autocomplete="off"
                         oninput="buscarParticipante(this, 'professores')"
                         onfocus="buscarParticipante(this, 'professores')">
                  <div id="resultados-professores" class="search-results"></div>
                </div>
                <div id="selecionados-professores" class="selected-items"></div>
                <div id="hidden-professores"></div>
              </div>

              <div class="form-group">
                <label>Tags / Competências</label>
                <div style="position:relative;">
                  <input type="text" class="form-control-custom" id="busca-tags"
                         placeholder="Buscar tag..."
                         autocomplete="off"
                         oninput="buscarTag(this)"
                         onfocus="buscarTag(this)">
                  <div id="resultados-tags" class="search-results"></div>
                </div>
                <div id="selecionados-tags" class="selected-items"></div>
                <div id="hidden-tags"></div>
              </div>

              <div class="form-group">
                <label style="flex-direction:row;align-items:center;gap:8px;cursor:pointer;">
                  <input type="checkbox" th:field="*{concluido}" id="eventoConcluido"
                         style="width:18px;height:18px;accent-color:var(--primary);">
                  Evento concluído
                </label>
              </div>
            </div>
          </div>

          <div class="tab-pane fade" id="publicacao">
            <div class="form-custom">
              <div class="form-group">
                <label for="imagemEvento">Imagem do Evento</label>
                <input type="file" class="form-control-custom" name="imagemFile"
                       id="imagemEvento" accept="image/*">
                <input type="hidden" th:field="*{imagemUrl}">
                <div style="font-size:.75rem;color:var(--gray-400);">Selecione uma imagem para divulgação do evento.</div>
                <div th:if="${evento.imagemUrl != null}" style="margin-top:8px;">
                  <img th:src="${evento.imagemUrl}" alt="Imagem atual" style="max-height:150px;border-radius:8px;border:1px solid var(--gray-200);">
                </div>
              </div>
              <div class="form-group">
                <label for="mensagemPublicacao">Mensagem de Publicação</label>
                <textarea class="form-control-custom"
                          th:field="*{mensagemPublicacao}"
                          id="mensagemPublicacao"
                          rows="5"
                          placeholder="Escreva a mensagem para ser publicada nas redes sociais..."></textarea>
                <div style="font-size:.75rem;color:var(--gray-400);">Texto usado ao publicar o evento no LinkedIn.</div>
              </div>
            </div>
          </div>

          </div>

          <div class="card-custom-footer" style="margin-top:24px;padding:16px 0 0;border-top:1px solid var(--gray-100);background:transparent;">
            <a th:href="@{/evento}" class="btn-custom btn-custom-outline">Voltar</a>
            <button type="submit" class="btn-custom btn-custom-primary">Salvar</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>

<script th:inline="javascript">
/*<![CDATA[*/
var dadosUsuarios = {
    organizadores: [
        /*[# th:each="u : ${organizadores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    palestrantes: [
        /*[# th:each="u : ${palestrantes}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    professores: [
        /*[# th:each="u : ${professores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ]
};
var dadosDisciplinas = [
    /*[# th:each="d : ${disciplinas}"]*/
    {id: /*[[${d.id}]]*/, nome: /*[[${d.nome}]]*/}/*[# th:if="${!dStat.last}"]*/,/*[/]*/
    /*[/]*/
];
/*[# th:if="${evento.disciplina != null}"]*/
var selecionadoDisciplina = {id: /*[[${evento.disciplina.id}]]*/, nome: /*[[${evento.disciplina.nome}]]*/};
/*[/]*/
/*[# th:if="${evento.disciplina == null}"]*/
var selecionadoDisciplina = null;
/*[/]*/
var dadosTags = [
    /*[# th:each="t : ${tags}"]*/
    {id: /*[[${t.id}]]*/, nome: /*[[${t.nome}]]*/}/*[# th:if="${!tStat.last}"]*/,/*[/]*/
    /*[/]*/
];
var selecionadosTags = [
    /*[# th:each="t : ${evento.tags}"]*/
    {id: /*[[${t.id}]]*/, nome: /*[[${t.nome}]]*/}/*[# th:if="${!tStat.last}"]*/,/*[/]*/
    /*[/]*/
];
var selecionados = {
    organizadores: [
        /*[# th:each="u : ${evento.organizadores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    palestrantes: [
        /*[# th:each="u : ${evento.palestrantes}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    professores: [
        /*[# th:each="u : ${evento.professores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ]
};
/*]]>*/
</script>
<script>
function buscarTag(input) {
    var busca = input.value.trim().toLowerCase();
    var resultados = document.getElementById('resultados-tags');
    resultados.innerHTML = '';
    var disponiveis = dadosTags.filter(function(t) {
        return !estaTagSelecionada(t.id);
    }).sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    if (busca !== '') {
        disponiveis = disponiveis.filter(function(t) {
            return t.nome.toLowerCase().includes(busca);
        });
    }
    if (disponiveis.length === 0) { resultados.classList.remove('show'); return; }
    disponiveis.forEach(function(t) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = t.nome + ' <span class="badge-custom">+ Adicionar</span>';
        btn.onclick = function() { adicionarTag(t); };
        resultados.appendChild(btn);
    });
    resultados.classList.add('show');
}
function estaTagSelecionada(id) {
    return selecionadosTags.some(function(t) { return t.id === id; });
}
function adicionarTag(tag) {
    selecionadosTags.push(tag);
    atualizarTagsSelecionadas();
    var input = document.getElementById('busca-tags');
    input.value = '';
    input.focus();
    document.getElementById('resultados-tags').classList.remove('show');
}
function removerTag(id) {
    selecionadosTags = selecionadosTags.filter(function(t) { return t.id !== id; });
    atualizarTagsSelecionadas();
}
function atualizarTagsSelecionadas() {
    var container = document.getElementById('selecionados-tags');
    var hiddenContainer = document.getElementById('hidden-tags');
    container.innerHTML = '';
    hiddenContainer.innerHTML = '';
    selecionadosTags.forEach(function(t) {
        var tag = document.createElement('span');
        tag.className = 'selected-item';
        var text = document.createTextNode(t.nome);
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'remove';
        closeBtn.textContent = '×';
        closeBtn.onclick = function() { removerTag(t.id); };
        tag.appendChild(text);
        tag.appendChild(closeBtn);
        container.appendChild(tag);
        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'tags';
        hidden.value = t.id;
        hiddenContainer.appendChild(hidden);
    });
}
function buscarParticipante(input, tipo) {
    var busca = input.value.trim().toLowerCase();
    var resultados = document.getElementById('resultados-' + tipo);
    resultados.innerHTML = '';
    var disponiveis = (dadosUsuarios[tipo] || []).filter(function(u) {
        return !estaSelecionado(u.id, tipo);
    }).sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    if (busca !== '') {
        disponiveis = disponiveis.filter(function(u) {
            return u.nome.toLowerCase().includes(busca);
        });
    }
    if (disponiveis.length === 0) { resultados.classList.remove('show'); return; }
    disponiveis.forEach(function(u) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = u.nome + ' <span class="badge-custom">+ Adicionar</span>';
        btn.onclick = function() { adicionarParticipante(u, tipo); };
        resultados.appendChild(btn);
    });
    resultados.classList.add('show');
}
function estaSelecionado(id, tipo) {
    return (selecionados[tipo] || []).some(function(u) { return u.id === id; });
}
function adicionarParticipante(usuario, tipo) {
    if (!selecionados[tipo]) selecionados[tipo] = [];
    selecionados[tipo].push(usuario);
    atualizarTags(tipo);
    var input = document.getElementById('busca-' + tipo);
    input.value = '';
    input.focus();
    document.getElementById('resultados-' + tipo).classList.remove('show');
}
function removerParticipante(id, tipo) {
    if (!selecionados[tipo]) return;
    selecionados[tipo] = selecionados[tipo].filter(function(u) { return u.id !== id; });
    atualizarTags(tipo);
}
function atualizarTags(tipo) {
    var container = document.getElementById('selecionados-' + tipo);
    var hiddenContainer = document.getElementById('hidden-' + tipo);
    container.innerHTML = '';
    hiddenContainer.innerHTML = '';
    (selecionados[tipo] || []).forEach(function(u) {
        var tag = document.createElement('span');
        tag.className = 'selected-item';
        var text = document.createTextNode(u.nome);
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'remove';
        closeBtn.textContent = '×';
        closeBtn.onclick = function() { removerParticipante(u.id, tipo); };
        tag.appendChild(text);
        tag.appendChild(closeBtn);
        container.appendChild(tag);
        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = tipo;
        hidden.value = u.id;
        hiddenContainer.appendChild(hidden);
    });
}
function buscarDisciplina(input) {
    var busca = input.value.trim().toLowerCase();
    var resultados = document.getElementById('resultados-disciplina');
    resultados.innerHTML = '';
    var disponiveis = dadosDisciplinas.slice().sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    if (busca !== '') {
        disponiveis = disponiveis.filter(function(d) {
            return d.nome.toLowerCase().includes(busca);
        });
    }
    if (disponiveis.length === 0) { resultados.classList.remove('show'); return; }
    disponiveis.forEach(function(d) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.innerHTML = d.nome + ' <span class="badge-custom">+ Adicionar</span>';
        btn.onclick = function() { adicionarDisciplina(d); };
        resultados.appendChild(btn);
    });
    resultados.classList.add('show');
}
function adicionarDisciplina(disciplina) {
    if (selecionadoDisciplina && selecionadoDisciplina.id === disciplina.id) return;
    selecionadoDisciplina = disciplina;
    atualizarTagDisciplina();
    var input = document.getElementById('busca-disciplina');
    input.value = '';
    input.focus();
    document.getElementById('resultados-disciplina').classList.remove('show');
}
function removerDisciplina() {
    selecionadoDisciplina = null;
    atualizarTagDisciplina();
}
function atualizarTagDisciplina() {
    var container = document.getElementById('selecionados-disciplina');
    var hiddenContainer = document.getElementById('hidden-disciplina');
    container.innerHTML = '';
    hiddenContainer.innerHTML = '';
    if (selecionadoDisciplina) {
        var tag = document.createElement('span');
        tag.className = 'selected-item';
        var text = document.createTextNode(selecionadoDisciplina.nome);
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'remove';
        closeBtn.textContent = '×';
        closeBtn.onclick = removerDisciplina;
        tag.appendChild(text);
        tag.appendChild(closeBtn);
        container.appendChild(tag);
        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'disciplina.id';
        hidden.value = selecionadoDisciplina.id;
        hiddenContainer.appendChild(hidden);
    }
}
function mudarTab(el, targetId) {
  document.querySelectorAll('.tab-nav a').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('show', 'active'); });
  var target = document.getElementById(targetId);
  if (target) target.classList.add('show', 'active');
  return false;
}
function validarFormEvento(form) {
  var valido = true;
  var firstInvalidTab = null;
  form.querySelectorAll('.form-control-custom').forEach(function(input) {
    input.classList.remove('is-invalid');
    var tab = input.closest('.tab-pane');
    if (input.hasAttribute('required') && !input.value.trim()) {
      input.classList.add('is-invalid');
      valido = false;
      if (tab && !firstInvalidTab) firstInvalidTab = tab;
    }
    if (input.type === 'email' && input.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) {
      input.classList.add('is-invalid');
      valido = false;
      if (tab && !firstInvalidTab) firstInvalidTab = tab;
    }
    if (input.id === 'horaInicio' && input.value.trim() && document.getElementById('horaFim').value.trim()) {
      if (document.getElementById('horaFim').value <= input.value) {
        input.classList.add('is-invalid');
        document.getElementById('horaFim').classList.add('is-invalid');
        valido = false;
        if (tab && !firstInvalidTab) firstInvalidTab = tab;
      }
    }
  });
  if (!valido && firstInvalidTab) {
    var tabId = firstInvalidTab.id;
    document.querySelectorAll('.tab-nav a').forEach(function(a) {
      if (a.getAttribute('onclick') && a.getAttribute('onclick').includes(tabId)) {
        mudarTab(a, tabId);
      }
    });
  }
  return valido;
}
document.addEventListener('click', function(e) {
    ['organizadores', 'palestrantes', 'professores', 'disciplina', 'tags'].forEach(function(tipo) {
        var input = document.getElementById('busca-' + tipo);
        var resultados = document.getElementById('resultados-' + tipo);
        if (input && resultados && resultados.classList.contains('show')) {
            if (!input.contains(e.target) && !resultados.contains(e.target)) {
                resultados.classList.remove('show');
            }
        }
    });
});
document.addEventListener('DOMContentLoaded', function() {
    ['organizadores', 'palestrantes', 'professores'].forEach(function(tipo) {
        atualizarTags(tipo);
    });
    atualizarTagDisciplina();
    atualizarTagsSelecionadas();
});
</script>
</body>
</html>
