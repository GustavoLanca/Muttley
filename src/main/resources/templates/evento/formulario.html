<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${evento.id != null} ? 'Editar Evento' : 'Novo Evento'"></h4>
        </div>
        <div class="card-body">

            <form th:action="@{/evento/salvar}" th:object="${evento}" method="post" novalidate
                  onsubmit="return validarFormEvento(this)">

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Título</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{titulo}"
                           id="tituloEvento"
                           placeholder="Ex: Workshop de Metodologia Ágil"
                           maxlength="150"
                           required>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descrição</label>
                    <textarea class="form-control"
                              th:field="*{descricao}"
                              id="descricaoEvento"
                              rows="3"
                              placeholder="Descreva brevemente o evento..."
                              maxlength="500"></textarea>
                    <div class="invalid-feedback">
                        Descrição muito curta (mín. 10 caracteres) ou com caracteres inválidos.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Carga Horária (horas)</label>
                    <input type="number"
                           class="form-control"
                           th:field="*{cargaHoraria}"
                           id="cargaHoraria"
                           placeholder="Ex: 4"
                           min="1"
                           max="999"
                           required>
                    <div class="invalid-feedback">
                        Carga horária inválida. Informe um número entre 1 e 999.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Pontos</label>
                    <input type="number"
                           class="form-control"
                           th:field="*{pontos}"
                           id="pontosEvento"
                           placeholder="Ex: 100"
                           min="0"
                           required>
                    <div class="invalid-feedback">Informe quantos pontos vale este evento.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tipo</label>
                    <select class="form-select" th:field="*{tipo}" id="tipoEvento" required>
                        <option value="">Selecione o tipo...</option>
                        <option value="PALESTRA">Palestra</option>
                        <option value="WORKSHOP">Workshop</option>
                        <option value="AULA_ABERTA">Aula Aberta</option>
                        <option value="SEMINARIO">Seminário</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                    <div class="invalid-feedback">Selecione o tipo do evento.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Data e Hora</label>
                    <input type="datetime-local"
                           class="form-control"
                           th:field="*{data}"
                           id="dataEvento"
                           required>
                    <div class="invalid-feedback">Informe uma data válida.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Disciplina Relacionada</label>
                    <select class="form-select" th:field="*{disciplina.id}" id="disciplinaEvento">
                        <option value="">Nenhuma</option>
                        <option th:each="d : ${disciplinas}"
                                th:value="${d.id}"
                                th:text="${d.nome}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tags / Competências</label>
                    <div class="border rounded p-3 bg-white">
                        <div th:each="t : ${tags}" class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="tags"
                                   th:value="${t.id}"
                                   th:id="${'tag-' + t.id}"
                                   th:checked="${evento.tags != null && evento.tags.contains(t)}">
                            <label class="form-check-label"
                                   th:for="${'tag-' + t.id}"
                                   th:text="${t.nome}"></label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/evento}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
