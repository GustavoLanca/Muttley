<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0" th:text="${evento.id != null} ? 'Editar Evento' : 'Novo Evento'"></h4>
        </div>
        <div class="card-body">

            <form th:action="@{/evento/salvar}" th:object="${evento}" method="post" novalidate
                  onsubmit="return validarFormEvento(this)">

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Título</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{titulo}"
                           id="tituloEvento"
                           placeholder="Ex: Workshop de Metodologia Ágil"
                           maxlength="150"
                           required>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descrição</label>
                    <textarea class="form-control"
                              th:field="*{descricao}"
                              id="descricaoEvento"
                              rows="3"
                              placeholder="Descreva brevemente o evento..."
                              maxlength="500"></textarea>
                    <div class="invalid-feedback">
                        Descrição muito curta (mín. 10 caracteres) ou com caracteres inválidos.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tipo</label>
                    <select class="form-select" th:field="*{tipo}" id="tipoEvento" required>
                        <option value="">Selecione o tipo...</option>
                        <option value="PALESTRA">Palestra</option>
                        <option value="WORKSHOP">Workshop</option>
                        <option value="AULA_ABERTA">Aula Aberta</option>
                        <option value="SEMINARIO">Seminário</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                    <div class="invalid-feedback">Selecione o tipo do evento.</div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data</label>
                        <input type="date"
                               class="form-control"
                               th:field="*{data}"
                               id="dataEvento"
                               required>
                        <div class="invalid-feedback">Informe uma data válida.</div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Início</label>
                        <input type="time"
                               class="form-control"
                               th:field="*{horaInicio}"
                               id="horaInicio"
                               required>
                        <div class="invalid-feedback">Informe o horário de início.</div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Encerramento</label>
                        <input type="time"
                               class="form-control"
                               th:field="*{horaFim}"
                               id="horaFim"
                               required>
                        <div class="invalid-feedback">Informe o horário de encerramento.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Disciplina Relacionada</label>
                    <div class="position-relative">
                        <input type="text" class="form-control" id="busca-disciplina"
                               placeholder="Buscar disciplina..."
                               autocomplete="off"
                               oninput="buscarDisciplina(this)"
                               onfocus="buscarDisciplina(this)">
                        <div id="resultados-disciplina" class="list-group position-absolute w-100 shadow-sm"
                             style="z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border-radius: 0 0 4px 4px;">
                        </div>
                    </div>
                    <div id="selecionados-disciplina" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="hidden-disciplina"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Organizadores</label>
                    <div class="position-relative">
                        <input type="text" class="form-control" id="busca-organizadores"
                               placeholder="Buscar organizador..."
                               autocomplete="off"
                               oninput="buscarParticipante(this, 'organizadores')"
                               onfocus="buscarParticipante(this, 'organizadores')">
                        <div id="resultados-organizadores" class="list-group position-absolute w-100 shadow-sm"
                             style="z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border-radius: 0 0 4px 4px;">
                        </div>
                    </div>
                    <div id="selecionados-organizadores" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="hidden-organizadores"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Palestrantes</label>
                    <div class="position-relative">
                        <input type="text" class="form-control" id="busca-palestrantes"
                               placeholder="Buscar palestrante..."
                               autocomplete="off"
                               oninput="buscarParticipante(this, 'palestrantes')"
                               onfocus="buscarParticipante(this, 'palestrantes')">
                        <div id="resultados-palestrantes" class="list-group position-absolute w-100 shadow-sm"
                             style="z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border-radius: 0 0 4px 4px;">
                        </div>
                    </div>
                    <div id="selecionados-palestrantes" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="hidden-palestrantes"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Professores</label>
                    <div class="position-relative">
                        <input type="text" class="form-control" id="busca-professores"
                               placeholder="Buscar professor..."
                               autocomplete="off"
                               oninput="buscarParticipante(this, 'professores')"
                               onfocus="buscarParticipante(this, 'professores')">
                        <div id="resultados-professores" class="list-group position-absolute w-100 shadow-sm"
                             style="z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border-radius: 0 0 4px 4px;">
                        </div>
                    </div>
                    <div id="selecionados-professores" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="hidden-professores"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tags / Competências</label>
                    <div class="position-relative">
                        <input type="text" class="form-control" id="busca-tags"
                               placeholder="Buscar tag..."
                               autocomplete="off"
                               oninput="buscarTag(this)"
                               onfocus="buscarTag(this)">
                        <div id="resultados-tags" class="list-group position-absolute w-100 shadow-sm"
                             style="z-index: 1000; display: none; max-height: 200px; overflow-y: auto; border-radius: 0 0 4px 4px;">
                        </div>
                    </div>
                    <div id="selecionados-tags" class="d-flex flex-wrap gap-2 mt-2"></div>
                    <div id="hidden-tags"></div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/evento}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>

            </form>
        </div>
    </div>
</div>
<script th:inline="javascript">
/*<![CDATA[*/
var dadosUsuarios = {
    organizadores: [
        /*[# th:each="u : ${organizadores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    palestrantes: [
        /*[# th:each="u : ${palestrantes}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    professores: [
        /*[# th:each="u : ${professores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ]
};
var dadosDisciplinas = [
    /*[# th:each="d : ${disciplinas}"]*/
    {id: /*[[${d.id}]]*/, nome: /*[[${d.nome}]]*/}/*[# th:if="${!dStat.last}"]*/,/*[/]*/
    /*[/]*/
];
/*[# th:if="${evento.disciplina != null}"]*/
var selecionadoDisciplina = {id: /*[[${evento.disciplina.id}]]*/, nome: /*[[${evento.disciplina.nome}]]*/};
/*[/]*/
/*[# th:if="${evento.disciplina == null}"]*/
var selecionadoDisciplina = null;
/*[/]*/
var dadosTags = [
    /*[# th:each="t : ${tags}"]*/
    {id: /*[[${t.id}]]*/, nome: /*[[${t.nome}]]*/}/*[# th:if="${!tStat.last}"]*/,/*[/]*/
    /*[/]*/
];
var selecionadosTags = [
    /*[# th:each="t : ${evento.tags}"]*/
    {id: /*[[${t.id}]]*/, nome: /*[[${t.nome}]]*/}/*[# th:if="${!tStat.last}"]*/,/*[/]*/
    /*[/]*/
];
var selecionados = {
    organizadores: [
        /*[# th:each="u : ${evento.organizadores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    palestrantes: [
        /*[# th:each="u : ${evento.palestrantes}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ],
    professores: [
        /*[# th:each="u : ${evento.professores}"]*/
        {id: /*[[${u.id}]]*/, nome: /*[[${u.nome}]]*/}/*[# th:if="${!uStat.last}"]*/,/*[/]*/
        /*[/]*/
    ]
};
/*]]>*/
</script>
<script>
function buscarTag(input) {
    var busca = input.value.trim().toLowerCase();
    var resultados = document.getElementById('resultados-tags');
    resultados.innerHTML = '';
    var disponiveis = dadosTags.filter(function(t) {
        return !estaTagSelecionada(t.id);
    }).sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    if (busca !== '') {
        disponiveis = disponiveis.filter(function(t) {
            return t.nome.toLowerCase().includes(busca);
        });
    }
    if (disponiveis.length === 0) { resultados.style.display = 'none'; return; }
    disponiveis.forEach(function(t) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2';
        btn.innerHTML = t.nome + ' <span class="badge bg-primary rounded-pill">+ Adicionar</span>';
        btn.onclick = function() { adicionarTag(t); };
        resultados.appendChild(btn);
    });
    resultados.style.display = 'block';
}
function estaTagSelecionada(id) {
    return selecionadosTags.some(function(t) { return t.id === id; });
}
function adicionarTag(tag) {
    selecionadosTags.push(tag);
    atualizarTagsSelecionadas();
    var input = document.getElementById('busca-tags');
    input.value = '';
    input.focus();
    document.getElementById('resultados-tags').style.display = 'none';
}
function removerTag(id) {
    selecionadosTags = selecionadosTags.filter(function(t) { return t.id !== id; });
    atualizarTagsSelecionadas();
}
function atualizarTagsSelecionadas() {
    var container = document.getElementById('selecionados-tags');
    var hiddenContainer = document.getElementById('hidden-tags');
    container.innerHTML = '';
    hiddenContainer.innerHTML = '';
    selecionadosTags.forEach(function(t) {
        var tag = document.createElement('span');
        tag.className = 'badge bg-secondary d-inline-flex align-items-center gap-1 ps-3 pe-1 py-2';
        tag.style.fontSize = '0.85rem';
        var text = document.createTextNode(t.nome);
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'btn-close btn-close-white ms-1';
        closeBtn.style.fontSize = '0.5rem';
        closeBtn.onclick = function() { removerTag(t.id); };
        closeBtn.setAttribute('aria-label', 'Remover');
        tag.appendChild(text);
        tag.appendChild(closeBtn);
        container.appendChild(tag);
        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'tags';
        hidden.value = t.id;
        hiddenContainer.appendChild(hidden);
    });
}
function buscarParticipante(input, tipo) {
    var busca = input.value.trim().toLowerCase();
    var resultados = document.getElementById('resultados-' + tipo);
    resultados.innerHTML = '';
    var disponiveis = (dadosUsuarios[tipo] || []).filter(function(u) {
        return !estaSelecionado(u.id, tipo);
    }).sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    if (busca !== '') {
        disponiveis = disponiveis.filter(function(u) {
            return u.nome.toLowerCase().includes(busca);
        });
    }
    if (disponiveis.length === 0) { resultados.style.display = 'none'; return; }
    disponiveis.forEach(function(u) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2';
        btn.innerHTML = u.nome + ' <span class="badge bg-primary rounded-pill">+ Adicionar</span>';
        btn.onclick = function() { adicionarParticipante(u, tipo); };
        resultados.appendChild(btn);
    });
    resultados.style.display = 'block';
}
function estaSelecionado(id, tipo) {
    return (selecionados[tipo] || []).some(function(u) { return u.id === id; });
}
function adicionarParticipante(usuario, tipo) {
    if (!selecionados[tipo]) selecionados[tipo] = [];
    selecionados[tipo].push(usuario);
    atualizarTags(tipo);
    var input = document.getElementById('busca-' + tipo);
    input.value = '';
    input.focus();
    document.getElementById('resultados-' + tipo).style.display = 'none';
}
function removerParticipante(id, tipo) {
    if (!selecionados[tipo]) return;
    selecionados[tipo] = selecionados[tipo].filter(function(u) { return u.id !== id; });
    atualizarTags(tipo);
}
function atualizarTags(tipo) {
    var container = document.getElementById('selecionados-' + tipo);
    var hiddenContainer = document.getElementById('hidden-' + tipo);
    container.innerHTML = '';
    hiddenContainer.innerHTML = '';
    (selecionados[tipo] || []).forEach(function(u) {
        var tag = document.createElement('span');
        tag.className = 'badge bg-secondary d-inline-flex align-items-center gap-1 ps-3 pe-1 py-2';
        tag.style.fontSize = '0.85rem';
        var text = document.createTextNode(u.nome);
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'btn-close btn-close-white ms-1';
        closeBtn.style.fontSize = '0.5rem';
        closeBtn.onclick = function() { removerParticipante(u.id, tipo); };
        closeBtn.setAttribute('aria-label', 'Remover');
        tag.appendChild(text);
        tag.appendChild(closeBtn);
        container.appendChild(tag);
        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = tipo;
        hidden.value = u.id;
        hiddenContainer.appendChild(hidden);
    });
}
function buscarDisciplina(input) {
    var busca = input.value.trim().toLowerCase();
    var resultados = document.getElementById('resultados-disciplina');
    resultados.innerHTML = '';
    var disponiveis = dadosDisciplinas.slice().sort(function(a, b) { return a.nome.localeCompare(b.nome); });
    if (busca !== '') {
        disponiveis = disponiveis.filter(function(d) {
            return d.nome.toLowerCase().includes(busca);
        });
    }
    if (disponiveis.length === 0) { resultados.style.display = 'none'; return; }
    disponiveis.forEach(function(d) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2';
        btn.innerHTML = d.nome + ' <span class="badge bg-primary rounded-pill">+ Adicionar</span>';
        btn.onclick = function() { adicionarDisciplina(d); };
        resultados.appendChild(btn);
    });
    resultados.style.display = 'block';
}
function adicionarDisciplina(disciplina) {
    if (selecionadoDisciplina && selecionadoDisciplina.id === disciplina.id) return;
    selecionadoDisciplina = disciplina;
    atualizarTagDisciplina();
    var input = document.getElementById('busca-disciplina');
    input.value = '';
    input.focus();
    document.getElementById('resultados-disciplina').style.display = 'none';
}
function removerDisciplina() {
    selecionadoDisciplina = null;
    atualizarTagDisciplina();
}
function atualizarTagDisciplina() {
    var container = document.getElementById('selecionados-disciplina');
    var hiddenContainer = document.getElementById('hidden-disciplina');
    container.innerHTML = '';
    hiddenContainer.innerHTML = '';
    if (selecionadoDisciplina) {
        var tag = document.createElement('span');
        tag.className = 'badge bg-secondary d-inline-flex align-items-center gap-1 ps-3 pe-1 py-2';
        tag.style.fontSize = '0.85rem';
        var text = document.createTextNode(selecionadoDisciplina.nome);
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'btn-close btn-close-white ms-1';
        closeBtn.style.fontSize = '0.5rem';
        closeBtn.onclick = removerDisciplina;
        closeBtn.setAttribute('aria-label', 'Remover');
        tag.appendChild(text);
        tag.appendChild(closeBtn);
        container.appendChild(tag);
        var hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'disciplina.id';
        hidden.value = selecionadoDisciplina.id;
        hiddenContainer.appendChild(hidden);
    }
}
document.addEventListener('click', function(e) {
    ['organizadores', 'palestrantes', 'professores', 'disciplina', 'tags'].forEach(function(tipo) {
        var input = document.getElementById('busca-' + tipo);
        var resultados = document.getElementById('resultados-' + tipo);
        if (input && resultados && resultados.style.display !== 'none') {
            if (!input.contains(e.target) && !resultados.contains(e.target)) {
                resultados.style.display = 'none';
            }
        }
    });
});
document.addEventListener('DOMContentLoaded', function() {
    ['organizadores', 'palestrantes', 'professores'].forEach(function(tipo) {
        atualizarTags(tipo);
    });
    atualizarTagDisciplina();
    atualizarTagsSelecionadas();
});
</script>
</body>
</html>
