<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Evento</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5" style="max-width: 500px;">
		<div class="card shadow-sm">
			<div class="card-header bg-primary text-white">
				<h4 class="mb-0"
					th:text="${evento.id != null} ? 'Editar Evento' : 'Novo Evento'"></h4>
			</div>
			<div class="card-body">
				<form th:action="@{/evento/salvar}" th:object="${evento}"
					method="post">

					<input type="hidden" th:field="*{id}" />

					<div class="mb-3">
						<label class="form-label fw-semibold">Descrição</label>
						<textarea class="form-control" th:field="*{descricao}" rows="3"></textarea>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Carga Horária (h)</label> <input
							type="number" class="form-control" th:field="*{cargaHoraria}"
							required>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Tipo</label> <select
							class="form-select" th:field="*{tipo}">
							<option value="PALESTRA">Palestra</option>
							<option value="WORKSHOP">Workshop</option>
							<option value="AULA_ABERTA">Aula Aberta</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Data</label> <input
							type="datetime-local" class="form-control" th:field="*{data}"
							required>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Disciplina</label> <select
							class="form-select" th:field="*{disciplina.id}">
							<option value="">Nenhuma</option>
							<option th:each="d : ${disciplinas}" th:value="${d.id}"
								th:text="${d.nome}"></option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Tags</label>
						<div th:each="t : ${tags}">
							<input type="checkbox" name="tags" th:value="${t.id}"
								th:id="${'tag-' + t.id}"> <label
								th:for="${'tag-' + t.id}" th:text="${t.nome}"></label>
						</div>
					</div>

				</form>
			</div>
		</div>
	</div>

</body>
</html>
