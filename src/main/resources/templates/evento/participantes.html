<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participantes do Evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 2L2 12v8l14 10 14-10v-8L16 2z"/>
        <path d="M8 16l4 4 8-8"/>
      </svg>
      Muttley
    </a>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}" class="active">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title" th:text="'Participantes - ' + ${evento.titulo}"></h1>
      <a th:href="@{/evento}" class="btn-custom btn-custom-outline">Voltar</a>
    </div>

    <div class="card-custom" style="margin-bottom:24px;">
      <div class="card-custom-header">
        <h5 class="card-custom-title">
          Inscritos (<span th:text="${totalInscritos}"></span>)
        </h5>
        <span class="badge-custom" style="background:var(--info-light);color:var(--info);">Aguardando confirmação</span>
      </div>
      <div class="card-custom-body" style="padding:0;">
        <th:block th:if="${totalInscritos == 0}">
          <div style="padding:32px;text-align:center;color:var(--gray-400);font-size:.875rem;">
            Nenhum inscrito neste evento.
          </div>
        </th:block>
        <th:block th:unless="${totalInscritos == 0}">
          <table class="table-custom">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Tipo</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${inscritos}">
                <td th:text="${p.usuario.id}"></td>
                <td th:text="${p.usuario.nome}"></td>
                <td th:text="${p.usuario.email}"></td>
                <td th:text="${p.usuario.tipo}"></td>
              </tr>
            </tbody>
          </table>
        </th:block>
      </div>
    </div>

    <div class="card-custom">
      <div class="card-custom-header">
        <h5 class="card-custom-title">
          Confirmados (<span th:text="${totalConfirmados}"></span>)
        </h5>
        <span class="badge-custom" style="background:var(--success-light);color:var(--success);">Presença confirmada</span>
      </div>
      <div class="card-custom-body" style="padding:0;">
        <th:block th:if="${totalConfirmados == 0}">
          <div style="padding:32px;text-align:center;color:var(--gray-400);font-size:.875rem;">
            Nenhum participante confirmado neste evento.
          </div>
        </th:block>
        <th:block th:unless="${totalConfirmados == 0}">
          <table class="table-custom">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Tipo</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${confirmados}">
                <td th:text="${p.usuario.id}"></td>
                <td th:text="${p.usuario.nome}"></td>
                <td th:text="${p.usuario.email}"></td>
                <td th:text="${p.usuario.tipo}"></td>
              </tr>
            </tbody>
          </table>
        </th:block>
      </div>
    </div>

    <div style="margin-top:16px;">
      <a th:href="@{/evento}" class="btn-custom btn-custom-outline">Voltar para eventos</a>
    </div>
  </div>
</main>

</body>
</html>
