<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participação Confirmada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}" class="active">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:520px;">
    <div class="card-custom" style="text-align:center;">
      <div class="card-custom-header" style="text-align:center;padding-top:32px;">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--success-light);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--success);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1 class="page-title" style="font-size:1.5rem;">Participação Confirmada!</h1>
      </div>
      <div class="card-custom-body">

        <div th:if="${linkedinMsg}" class="alert-custom alert-custom-info" th:text="${linkedinMsg}"></div>

        <div style="margin:16px 0 24px;">
          <h5 th:text="${evento.titulo}" style="margin:0 0 4px;color:var(--gray-900);"></h5>
          <p style="color:var(--gray-500);font-size:.875rem;margin:0;" th:text="'Participação confirmada para ' + ${usuario.nome}"></p>
        </div>

        <a th:href="${downloadUrl}" class="btn-custom btn-custom-success btn-custom-lg" style="margin-bottom:12px;">Baixar Certificado</a>
        <br>
        <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>

      </div>
    </div>
  </div>
</main>

</body>
</html>
