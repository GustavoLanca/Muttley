<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participação Confirmada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}" class="active">Eventos</a>
      <a th:href="@{/usuario}">Usuários</a>
      <a th:href="@{/curso}">Cursos</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
      <a th:href="@{/medalha/ranking}">Medalhas</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:520px;">
    <div class="card-custom" style="text-align:center;">
      <div class="card-custom-header" style="text-align:center;padding-top:32px;">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--success-light);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--success);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1 class="page-title" style="font-size:1.5rem;">Participação Confirmada!</h1>
      </div>
      <div class="card-custom-body">

        <div th:if="${linkedinMsg != null and !#strings.startsWith(linkedinMsg, 'Erro')}"
             class="alert-custom alert-custom-info" th:text="${linkedinMsg}" style="margin-bottom:20px;"></div>

        <div th:if="${linkedinMsg != null and #strings.startsWith(linkedinMsg, 'Erro')}"
             style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:16px;margin-bottom:20px;text-align:center;">
          <p style="color:#ef4444;font-weight:500;margin:0 0 12px;" th:text="${linkedinMsg}"></p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <a th:href="@{/linkedin/auth(usuarioId=${usuario.id}, eventoId=${evento.id})}" class="btn-custom btn-custom-primary btn-custom-sm">Tentar novamente</a>
          </div>
        </div>

        <div style="margin:16px 0 24px;">
          <h5 th:text="${evento.titulo}" style="margin:0 0 4px;color:var(--gray-900);"></h5>
          <p style="color:var(--gray-500);font-size:.875rem;margin:0;" th:text="'Participação confirmada para ' + ${usuario.nome}"></p>
          <p style="color:var(--gray-500);font-size:.875rem;margin:0;">Uma cópia do certificado foi enviada ao seu email!</p>
        </div>

        <div id="download" style="margin-top:8px;">
          <a th:href="${downloadUrl}" class="btn-custom btn-custom-success btn-custom-lg" style="margin-bottom:12px;">Baixar Certificado</a>
          <div style="margin:16px 0;">
            <a th:href="@{/linkedin/auth(usuarioId=${usuario.id}, eventoId=${evento.id})}" class="btn-custom btn-custom-primary btn-custom-lg" style="margin-bottom:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:6px;">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
              Publicar no LinkedIn
            </a>
          </div>
          <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>
        </div>

      </div>
    </div>
  </div>
</main>

</body>
</html>
