<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Usuários</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="mb-0">Lista de Usuários</h2>
			<a th:href="@{/usuario/formulario}" class="btn btn-primary">+
				Novo Usuário</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body p-0">
				<table class="table table-striped table-hover mb-0">
					<thead class="table-primary">
						<tr>
							<th>ID</th>
							<th>Nome</th>
							<th>Tipo</th>
							<th>Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="u : ${lista}"
							th:data-id="${u.id}"
							th:data-nome="${u.nome}"
							th:data-email="${u.email}"
							th:data-cpf="${u.cpf}"
							th:data-linkedin="${u.linkedin}"
							th:data-tipo="${u.tipo}"
							th:data-pontos="${pontosMap.get(u.id) ?: 0}"
							th:data-medalhas="${#strings.listJoin(medalhasMap.get(u.id).![nome], ', ')}">
							<td th:text="${u.id}"></td>
							<td th:text="${u.nome}"></td>
							<td th:text="${u.tipo}"></td>
							<td>
								<button type="button" class="btn btn-sm btn-outline-warning"
									onclick="verDetalhesUsuario(this)">Medalhas</button>
								<a th:href="@{'/usuario/formulario/' + ${u.id}}"
									class="btn btn-sm btn-outline-primary">Editar</a>
								<a th:href="@{'/usuario/delete/' + ${u.id}}"
									class="btn btn-sm btn-outline-danger"
									onclick="return confirm('Excluir este usuário?')">Excluir</a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="mt-3">
			<a th:href="@{/}" class="btn btn-secondary">Voltar ao início</a>
		</div>
	</div>

<div class="modal fade" id="detalhesUsuarioModal" tabindex="-1">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="detalhesUsuarioTitulo"></h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
			</div>
			<div class="modal-body" id="detalhesUsuarioBody"></div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function verDetalhesUsuario(btn) {
	var row = btn.closest('tr');
	document.getElementById('detalhesUsuarioTitulo').textContent = 'Medalhas de ' + row.dataset.nome;
	var html = '';
	html += '<p><strong>Total Pontos:</strong> ' + row.dataset.pontos + '</p>';
	html += '<p><strong>Medalhas:</strong> ' + (row.dataset.medalhas || '—') + '</p>';
	document.getElementById('detalhesUsuarioBody').innerHTML = html;
	var modal = new bootstrap.Modal(document.getElementById('detalhesUsuarioModal'));
	modal.show();
}
</script>

</body>
</html>
