<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <img th:src="@{/muttleyR.png}" alt="Muttley">
      Muttley
    </a>
    <button class="nav-toggle" onclick="this.classList.toggle('active');document.querySelector('.navbar-links').classList.toggle('open')" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}" class="active">Usuários</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page">
    <div class="page-header">
      <h1 class="page-title">Lista de Usuários</h1>
      <a th:href="@{/usuario/formulario}" class="btn-custom btn-custom-primary">+ Novo Usuário</a>
    </div>

    <th:block th:if="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            </svg>
            <p>Nenhum usuário cadastrado.</p>
          </div>
        </div>
      </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(lista)}">
      <div class="card-custom">
        <div class="card-custom-body" style="padding:0;">
          <table class="table-custom">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${lista}"
                  th:data-id="${u.id}"
                  th:data-nome="${u.nome}"
                  th:data-email="${u.email}"
                  th:data-cpf="${u.cpf}"
                  th:data-linkedin="${u.linkedin}"
                  th:data-tipo="${u.tipo}"
                  th:data-pontos="${pontosMap.get(u.id) ?: 0}"
                  th:data-medalhas="${#strings.listJoin(medalhasMap.get(u.id).![nome], ', ')}">
                <td data-label="ID" th:text="${u.id}"></td>
                <td data-label="Nome" th:text="${u.nome}"></td>
                <td data-label="Tipo"><span class="badge-custom" th:text="${u.tipo}"></span></td>
                <td data-label="Ações">
                  <div class="actions-cell">
                    <button type="button" class="btn-custom btn-custom-outline btn-custom-sm"
                            onclick="verDetalhesUsuario(this)">Medalhas</button>
                    <a th:href="@{'/usuario/formulario/' + ${u.id}}"
                       class="btn-custom btn-custom-outline btn-custom-sm">Editar</a>
                    <a th:href="@{'/usuario/delete/' + ${u.id}}"
                       class="btn-custom btn-custom-danger btn-custom-sm"
                       onclick="return confirm('Excluir este usuário?')">Excluir</a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </th:block>

    <div style="margin-top:16px;">
      <a th:href="@{/}" class="btn-custom btn-custom-outline">Voltar ao início</a>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal-box" id="detalhesUsuarioModal">
  <div class="modal-box-header">
    <h5 id="detalhesUsuarioTitulo"></h5>
    <button type="button" class="qr-modal-close" onclick="fecharModal()">&times;</button>
  </div>
  <div class="modal-box-body" id="detalhesUsuarioBody"></div>
  <div class="modal-box-footer">
    <button type="button" class="btn-custom btn-custom-outline btn-custom-sm" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<script>
function verDetalhesUsuario(btn) {
  var row = btn.closest('tr');
  document.getElementById('detalhesUsuarioTitulo').textContent = 'Medalhas de ' + row.dataset.nome;
  var html = '';
  html += '<p><strong>Total Pontos:</strong> ' + row.dataset.pontos + '</p>';
  html += '<p><strong>Medalhas:</strong> ' + (row.dataset.medalhas || '—') + '</p>';
  document.getElementById('detalhesUsuarioBody').innerHTML = html;
  document.getElementById('detalhesUsuarioModal').classList.add('show');
  document.getElementById('modalOverlay').classList.add('show');
}
function fecharModal() {
  document.getElementById('detalhesUsuarioModal').classList.remove('show');
  document.getElementById('modalOverlay').classList.remove('show');
}
</script>
</body>
</html>
