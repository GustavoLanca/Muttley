<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Usuários</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2 class="mb-0">Lista de Usuários</h2>
			<a th:href="@{/usuario/formulario}" class="btn btn-primary">+
				Novo Usuário</a>
		</div>

		<div class="card shadow-sm">
			<div class="card-body p-0">
				<table class="table table-striped table-hover mb-0">
					<thead class="table-primary">
						<tr>
							<th>ID</th>
							<th>Nome</th>
							<th>Email</th>
							<th>Tipo</th>
							<th>Total Pontos</th>
							<th>Ações</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="u : ${lista}">
							<td th:text="${u.id}"></td>
							<td th:text="${u.nome}"></td>
							<td th:text="${u.email}"></td>
							<td th:text="${u.tipo}"></td>
							<td th:text="${pontosMap.get(u.id) ?: 0}"></td>
							<td><a th:href="@{'/usuario/formulario/' + ${u.id}}"
								class="btn btn-sm btn-outline-primary">Editar</a>
								<a th:href="@{'/participacao/pontos/' + ${u.id}}"
								class="btn btn-sm btn-outline-success">Ver Pontos</a>
								<a th:href="@{'/usuario/delete/' + ${u.id}}"
								class="btn btn-sm btn-outline-danger"
								onclick="return confirm('Excluir este usuário?')">Excluir</a></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="mt-3">
			<a th:href="@{/}" class="btn btn-secondary">Voltar ao início</a>
		</div>
	</div>

</body>
</html>
