<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Usuário</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5" style="max-width: 500px;">
		<div class="card shadow-sm">
			<div class="card-header bg-primary text-white">
				<h4 class="mb-0"
					th:text="${usuario.id != null} ? 'Editar Usuário' : 'Novo Usuário'"></h4>
			</div>
			<div class="card-body">

				<form th:action="@{/usuario/salvar}" th:object="${usuario}"
					method="post" novalidate onsubmit="return validarFormUsuario(this)">

					<input type="hidden" th:field="*{id}" />

					<div class="mb-3">
						<label class="form-label fw-semibold">Nome Completo</label> <input
							type="text" class="form-control" th:field="*{nome}"
							id="nomeUsuario" placeholder="Digite o nome completo"
							maxlength="100" required>
						<div class="invalid-feedback">Informe nome e sobrenome,
							somente letras (mín. 5 caracteres).</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">E-mail</label> <input
							type="text" class="form-control" th:field="*{email}"
							id="emailUsuario" placeholder="exemplo@email.com" maxlength="150"
							required>
						<div class="invalid-feedback">E-mail inválido. Informe um
							e-mail válido (ex: nome@dominio.com).</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Tipo de Usuário</label> <select
							class="form-select" th:field="*{tipo}" id="tipoUsuario" required>
							<option value="">Selecione...</option>
							<option value="ALUNO">Aluno</option>
							<option value="PROFESSOR">Professor</option>
							<option value="ORGANIZADOR">Organizador</option>
							<option value="EXTERNO">Externo</option>
						</select>
						<div class="invalid-feedback">Selecione um tipo de usuário.
						</div>
					</div>

					<div class="d-flex justify-content-between">
						<a th:href="@{/usuario}" class="btn btn-secondary">Voltar</a>
						<button type="submit" class="btn btn-primary">Salvar</button>
					</div>

				</form>
			</div>
		</div>
	</div>
</body>
</html>
