<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/muttley.css}">
</head>
<body>

<nav class="navbar-muttley">
  <div class="navbar-inner">
    <a th:href="@{/}" class="navbar-brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 2L2 12v8l14 10 14-10v-8L16 2z"/>
        <path d="M8 16l4 4 8-8"/>
      </svg>
      Muttley
    </a>
    <div class="navbar-links">
      <a th:href="@{/}">Início</a>
      <a th:href="@{/evento}">Eventos</a>
      <a th:href="@{/usuario}" class="active">Usuários</a>
      <a th:href="@{/disciplina}">Disciplinas</a>
      <a th:href="@{/tag}">Tags</a>
    </div>
  </div>
</nav>

<main>
  <div class="container-page" style="max-width:560px;">
    <div class="page-header">
      <h1 class="page-title" th:text="${usuario.id != null} ? 'Editar Usuário' : 'Novo Usuário'"></h1>
    </div>

    <div class="card-custom">
      <div class="card-custom-body">
        <form th:action="@{/usuario/salvar}" th:object="${usuario}" method="post"
              novalidate onsubmit="return validarFormUsuario(this)">

          <input type="hidden" th:field="*{id}"/>

          <div class="form-custom">
            <div class="form-group">
              <label for="nomeUsuario">Nome Completo</label>
              <input type="text" class="form-control-custom" th:field="*{nome}"
                     id="nomeUsuario" placeholder="Digite o nome completo"
                     maxlength="100" required>
              <div class="invalid-feedback">Informe nome e sobrenome, somente letras (mín. 5 caracteres).</div>
            </div>

            <div class="form-group">
              <label for="emailUsuario">E-mail</label>
              <input type="email" class="form-control-custom" th:field="*{email}"
                     id="emailUsuario" placeholder="exemplo@email.com" maxlength="150" required>
              <div class="invalid-feedback">E-mail inválido. Informe um e-mail válido.</div>
            </div>

            <div class="form-group">
              <label for="senhaUsuario">Senha</label>
              <input type="password" class="form-control-custom" th:field="*{senha}"
                     id="senhaUsuario" placeholder="Digite a senha" maxlength="100"
                     th:required="${usuario.id == null}">
              <div class="invalid-feedback">Informe uma senha.</div>
            </div>

            <div class="form-group">
              <label for="cpfUsuario">CPF</label>
              <input type="text" class="form-control-custom" th:field="*{cpf}"
                     id="cpfUsuario" placeholder="000.000.000-00" maxlength="14" required>
              <div class="invalid-feedback">Informe um CPF com 11 dígitos numéricos.</div>
            </div>

            <div class="form-group">
              <label for="linkedinUsuario">LinkedIn</label>
              <input type="text" class="form-control-custom" th:field="*{linkedin}"
                     id="linkedinUsuario" placeholder="seu-usuario (sem URL)" maxlength="100">
              <div class="invalid-feedback">Informe o nome de usuário.</div>
            </div>

            <div class="form-group">
              <label for="tipoUsuario">Tipo de Usuário</label>
              <select class="form-control-custom" th:field="*{tipo}" id="tipoUsuario" required>
                <option value="">Selecione...</option>
                <option value="ALUNO">Aluno</option>
                <option value="PROFESSOR">Professor</option>
                <option value="ORGANIZADOR">Organizador</option>
                <option value="PALESTRANTE">Palestrante</option>
                <option value="EXTERNO">Externo</option>
              </select>
              <div class="invalid-feedback">Selecione um tipo de usuário.</div>
            </div>
          </div>

          <div class="card-custom-footer" style="margin-top:20px;padding:16px 0 0;border-top:1px solid var(--gray-100);background:transparent;">
            <a th:href="@{/usuario}" class="btn-custom btn-custom-outline">Voltar</a>
            <button type="submit" class="btn-custom btn-custom-primary">Salvar</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>

<script>
function validarFormUsuario(form) {
  var valido = true;
  form.querySelectorAll('.form-control-custom').forEach(function(input) {
    input.classList.remove('is-invalid');
    if (input.hasAttribute('required') && !input.value.trim()) {
      input.classList.add('is-invalid');
      valido = false;
    }
    if (input.type === 'email' && input.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) {
      input.classList.add('is-invalid');
      valido = false;
    }
    if (input.id === 'nomeUsuario' && input.value.trim().length < 5) {
      input.classList.add('is-invalid');
      valido = false;
    }
    if (input.id === 'cpfUsuario' && input.value.trim()) {
      var digits = input.value.replace(/\D/g, '');
      if (digits.length !== 11) {
        input.classList.add('is-invalid');
        valido = false;
      }
    }

  });
  return valido;
}
</script>
</body>
</html>
